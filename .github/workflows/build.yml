name: Build Scamsung Kernel (A325F)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Nama defconfig untuk A325F (cek arch/arm64/configs/)"
        required: true
        default: "a32_defconfig"

env:
  KERNEL_NAME: "Scamsung"
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev build-essential \
            libncurses-dev python3 zip curl wget lz4 rsync

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: proton-clang-toolchain-v1

      - name: Setup Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ${{ github.workspace }}/clang

      - name: Add Clang to PATH
        run: |
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: List available defconfigs (debug)
        run: |
          echo "== Isi arch/arm64/configs/ =="
          ls -la arch/arm64/configs/ || echo "Folder arch/arm64/configs tidak ditemukan!"
          echo "== Cari yang mengandung 'a32' atau 'a325' =="
          ls arch/arm64/configs/ | grep -iE "a32|a325" || echo "Tidak ada nama yang cocok, cek manual daftar di atas."

      - name: Set kernel localversion
        run: |
          echo "-${{ env.KERNEL_NAME }}" > localversion

      - name: Strip KernelSU (kalau ada)
        run: |
          rm -rf KernelSU drivers/kernelsu 2>/dev/null || true
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
          fi

      - name: Generate defconfig
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          make O=out ARCH=$ARCH ${{ github.event.inputs.defconfig }}

      - name: Force strip KSU/root & enforce SELinux
        run: |
          CFG="out/.config"
          if [ ! -f "$CFG" ]; then echo "File .config tidak ditemukan, cek step sebelumnya."; exit 1; fi

          # Matikan fitur proprietary Samsung (RKP/KDP/UH hypervisor) yang
          # source implementasinya tidak disertakan di rilis open-source ini,
          # tapi pemanggilnya masih aktif di init/main.c -> bikin build gagal
          for opt in RKP RKP_CFP RKP_DMAP RKP_NS_PROT KDP KDP_CRED KDP_NS \
                     UH UH_RKP SECURITY_DEFEX FIVE PROCA; do
            ./scripts/config --file "$CFG" -d "$opt" 2>/dev/null || true
          done

          # Matikan semua varian nama KernelSU yang umum dipakai fork
          for opt in KSU KERNEL_SU KPROBES_HOOK KSU_SUSFS SUSFS; do
            ./scripts/config --file "$CFG" -d "$opt" 2>/dev/null || true
          done

          # Pastikan SELinux aktif dan tidak bisa dibikin permissive
          ./scripts/config --file "$CFG" -e SECURITY
          ./scripts/config --file "$CFG" -e SECURITY_SELINUX
          ./scripts/config --file "$CFG" -d SECURITY_SELINUX_DEVELOP
          ./scripts/config --file "$CFG" -d SECURITY_SELINUX_BOOTPARAM
          ./scripts/config --file "$CFG" -d SECURITY_SELINUX_DISABLE

          # Sinkronkan ulang config setelah dipaksa ubah
          make O=out ARCH=$ARCH olddefconfig

      - name: Verify clean config (fail build kalau tidak bersih)
        run: |
          CFG="out/.config"
          echo "== Cek jejak KSU/root =="
          if grep -E "^CONFIG_(KSU|KERNEL_SU|KSU_SUSFS|SUSFS)=y" "$CFG"; then
            echo "GAGAL: masih ada opsi KSU/root aktif di config!"
            exit 1
          fi
          echo "Bersih dari KSU/root."

          echo "== Cek status SELinux =="
          if grep -E "^CONFIG_SECURITY_SELINUX_DEVELOP=y|^CONFIG_SECURITY_SELINUX_BOOTPARAM=y|^CONFIG_SECURITY_SELINUX_DISABLE=y" "$CFG"; then
            echo "GAGAL: kernel masih bisa dijalankan dalam mode permissive!"
            exit 1
          fi
          if ! grep -q "^CONFIG_SECURITY_SELINUX=y" "$CFG"; then
            echo "GAGAL: CONFIG_SECURITY_SELINUX tidak aktif!"
            exit 1
          fi
          echo "SELinux terkunci Enforcing (tidak ada jalur permissive)."

      - name: Build kernel
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=implicit-int"
          make -j$(nproc --all) O=out ARCH=$ARCH CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="$KCFLAGS" 2>&1 | tee build.log

      - name: Check build output
        run: |
          IMG=$(find out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build gagal, tidak ada kernel image yang dihasilkan."
            tail -n 200 build.log
            exit 1
          fi
          echo "IMG_PATH=$IMG" >> $GITHUB_ENV

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp "$IMG_PATH" AnyKernel3/ || true
          DTBO=$(find out -name "dtbo.img" | head -n1)
          if [ -n "$DTBO" ]; then cp "$DTBO" AnyKernel3/; fi
          sed -i "s/kernel.string=.*/kernel.string=${KERNEL_NAME} by $(whoami)/" AnyKernel3/anykernel.sh || true
          cd AnyKernel3
          zip -r9 "../${KERNEL_NAME}-A325F-$(date +%Y%m%d-%H%M).zip" * -x ".git*" "README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-A325F
          path: "*.zip"
          retention-days: 14

      - name: Upload build log (jika error)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
