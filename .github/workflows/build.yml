name: Build Clean Kernel Samsung A32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip ccache glibc-source clang

    - name: Setup Compiler (Proton Clang)
      run: |
        mkdir -p toolchain
        cd toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

    - name: Compile Kernel
      run: |
        mkdir -p out
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Menggunakan a32_defconfig
        make O=out ARCH=arm64 a32_defconfig
        
        make -j$(nproc --all) O=out ARCH=arm64

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        
        # Salin hasil kompilasi
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
        elif [ -f out/arch/arm64/boot/Image ]; then
          cp out/arch/arm64/boot/Image AnyKernel3/
        fi
        
        cd AnyKernel3
        zip -r9 ../Clean-Kernel-A32.zip * -x .git README.md

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Clean-Kernel-A32
        path: Clean-Kernel-A32.zip
