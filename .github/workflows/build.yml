name: Build Scamsung Kernel (A325F)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Nama defconfig untuk A325F (cek arch/arm64/configs/)"
        required: true
        default: "a32_eea_open_defconfig"

env:
  KERNEL_NAME: "Scamsung"
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev build-essential \
            libncurses-dev python3 zip curl wget lz4 rsync

      - name: Setup Clang toolchain
        run: |
          mkdir -p ${{ github.workspace }}/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ${{ github.workspace }}/clang
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Set kernel localversion
        run: |
          echo "-${{ env.KERNEL_NAME }}" > localversion

      - name: Strip KernelSU (kalau ada)
        run: |
          # hapus folder KernelSU jika ada sebagai subtree/submodule
          rm -rf KernelSU drivers/kernelsu 2>/dev/null || true
          # hapus baris CONFIG_KSU dari defconfig yang dipakai
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
          fi

      - name: Generate defconfig
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          make O=out ARCH=$ARCH ${{ github.event.inputs.defconfig }}

      - name: Build kernel
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          make -j$(nproc --all) O=out ARCH=$ARCH CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee build.log

      - name: Check build output
        run: |
          IMG=$(find out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build gagal, tidak ada kernel image yang dihasilkan."
            tail -n 200 build.log
            exit 1
          fi
          echo "IMG_PATH=$IMG" >> $GITHUB_ENV

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp "$IMG_PATH" AnyKernel3/ || true
          DTBO=$(find out -name "dtbo.img" | head -n1)
          if [ -n "$DTBO" ]; then cp "$DTBO" AnyKernel3/; fi
          sed -i "s/kernel.string=.*/kernel.string=${KERNEL_NAME} by $(whoami)/" AnyKernel3/anykernel.sh || true
          cd AnyKernel3
          zip -r9 "../${KERNEL_NAME}-A325F-$(date +%Y%m%d-%H%M).zip" * -x ".git*" "README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-A325F
          path: "*.zip"
          retention-days: 14

      - name: Upload build log (jika error)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
